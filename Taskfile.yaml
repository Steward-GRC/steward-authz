version: '3'
vars:
  ARTIFACT_NAME: steward-authz
  TESTPARALLELISM: 4
  GOLIC_VERSION: v0.3.0
  GOLANGCI_VERSION: v2.12.2
  COMMON_LIC: "2026 The Steward Authors"
  TEMPLATE_LIC: "spdx-apache2"
tasks:
  default:
    cmds:
      - task: lint
  fmt:
    desc: Format Go sources
    cmds:
      - gofmt -w .
      - goimports -w ./
  build:
    desc: Build all packages
    cmds:
      - go build ./...
  test:
    desc: Run tests
    cmds:
      - go test -parallel {{.TESTPARALLELISM}} ./...
  test-cover:
    desc: Run tests with coverage reporting
    cmds:
      - go test ./... -cover
  rego:test:
    desc: Check and test the Rego bundles (opa fmt, opa check, opa test) and the publish script
    cmds:
      - opa fmt --fail --list policies
      - opa check --strict policies
      - opa test policies
      - bash scripts/publish-bundle_test.sh
  rego:bundle:
    desc: Build the OPA bundle (bundle.tar.gz) from policies/, without the tests
    cmds:
      - opa build --bundle policies --ignore '*_test.rego' --revision "$(git rev-parse HEAD)" --output bundle.tar.gz
  lint:
    desc: Run all linters
    deps: [test]
    cmds:
      - |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then echo "gofmt needed on:"; echo "$unformatted"; exit 1; fi
      - golangci-lint run
      - yamllint .
  lint-init:
    desc: Install lint dependencies (golangci-lint is built with the local Go toolchain)
    cmds:
      - brew install gitleaks yamllint
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_VERSION}}
      - go install golang.org/x/tools/cmd/goimports@latest
  license:
    desc: Verify every source file carries the Apache-2.0 license header (CI; never writes).
    cmds:
      - go install github.com/Bugs5382/golic/cmd/golic@{{.GOLIC_VERSION}}
      - golic inject -t {{.TEMPLATE_LIC}} -c "{{.COMMON_LIC}}" --dry -x
  license:fix:
    desc: Inject the Apache-2.0 header into any source file missing it.
    cmds:
      - go install github.com/Bugs5382/golic/cmd/golic@{{.GOLIC_VERSION}}
      - golic inject -t {{.TEMPLATE_LIC}} -c "{{.COMMON_LIC}}"
