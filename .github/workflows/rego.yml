name: rego
# The Rego bundles this repo owns: format, strict compile, unit tests, and the
# bundle build each service's image runs. There is no bundle store and no
# publish step: services build the bundle into their images.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
permissions:
  contents: read
jobs:
  rego:
    name: 📜 Rego
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1  # v2.4.0
        with:
          version: 1.21.1
      - name: opa fmt
        run: opa fmt --fail --list policies
      - name: opa check
        run: opa check --strict policies
      - name: opa test
        run: opa test --verbose policies
      - name: Bundle build and its tests
        run: |
          BUNDLE_REVISION="$GITHUB_SHA" sh scripts/build-bundle.sh bundle.tar.gz
          sh scripts/build-bundle_test.sh
